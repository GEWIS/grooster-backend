name: Frontend - Develop Docker Build

on:
    push:
        branches:
            - develop
        paths:
            - 'frontend/**'
            - '.github/workflows/frontend-docker-develop.yml'

jobs:
    build-develop:
        uses: GEWIS/actions/.github/workflows/docker-release.yml@v1
        with:
            projects: "['frontend']"
            version: 'develop'
            docker-registry: 'abc.docker-registry.gewis.nl'
            docker-paths: "['eou/grooster-frontend']"
        secrets:
            REGISTRY_USERNAME: ${{ secrets.SVC_GH_ABCEOU_USERNAME }}
            REGISTRY_PASSWORD: ${{ secrets.SVC_GH_ABCEOU_PWD }}
