name: Frontend - Lint and Build
on:
    push:
        branches:
            - develop
        paths:
            - 'frontend/**'
            - '.github/workflows/frontend-lint-and-build.yml'
    pull_request:
        branches:
            - develop
        paths:
            - 'frontend/**'
            - '.github/workflows/frontend-lint-and-build.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-lint:
        uses: GEWIS/actions/.github/workflows/lint-and-build-npm.yml@v1
        with:
            node-version: '22.x'
            format: true
            working-directory: './frontend'
