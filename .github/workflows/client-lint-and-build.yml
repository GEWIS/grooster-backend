name: Client - Lint and build

on:
  push:
    branches:
      - main
    paths:
      - 'packages/grooster-client/**'
      - '.github/workflows/client-lint-and-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/grooster-client/**'
      - '.github/workflows/client-lint-and-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint-client:
    uses: GEWIS/actions/.github/workflows/lint-and-build-npm.yml@v1
    with:
      node-version: "^22.0.0"
      build: true
      test: false
      working-directory: './packages/grooster-client'
      prepare-command: "docker build backend -t test-image && docker compose -f backend/docker-compose.test.yaml up -d"
      cleanup-command: 'docker compose -f backend/docker-compose.test.yaml down'
