<!doctype html>
<html lang="">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="src/assets/grooster-logo.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GRooster</title>
        <script>
            // Apply dark mode before Vue mounts to avoid a light flash (see stores/theme.store.ts)
            try {
                const mode = JSON.parse(localStorage.getItem('theme') || '{}').mode || 'system';
                const dark =
                    mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('app-dark', dark);
            } catch {}
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
